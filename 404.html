<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>길을 잃었어요 · 솜솜시티</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poor+Story&display=swap" rel="stylesheet">
<style>
:root{--paper:#fff;--paper-2:#F7F5EF;--ink:#22231F;--ink-soft:#66655E;--purple:#8B6BB8;--pink:#F28B8E;--font-hand:"Poor Story",cursive;--font-body:"Poor Story",cursive}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{font-synthesis:none}
body{background:var(--paper-2);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.7;word-break:keep-all;display:grid;place-items:center;min-height:100svh;padding:28px max(18px,env(safe-area-inset-left,0px))}
.box{width:min(760px,100%);display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px 40px;align-items:center}
.logo{grid-column:1/-1;justify-self:center;width:min(220px,56vw)}
.who{position:relative;display:grid;justify-items:center;width:fit-content;justify-self:center;padding-top:52px}
.who img{height:min(300px,42svh);width:auto;display:block}
.who::after{content:"";position:absolute;bottom:-8px;width:70%;aspect-ratio:5/1;border-radius:50%;background:radial-gradient(closest-side,rgba(72,58,44,.4),rgba(72,58,44,.12) 80%,rgba(72,58,44,0));z-index:-1}
.bub{position:absolute;top:0;left:44%;white-space:nowrap;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:6px 14px;font-family:var(--font-hand);font-size:19px;box-shadow:0 4px 0 rgba(34,35,31,.1)}
.bub::after{content:"";position:absolute;left:18px;bottom:-11px;width:16px;height:16px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg) skew(8deg,8deg);border-bottom-right-radius:4px}
.txt{display:grid;gap:12px}
.code{font-size:15.5px;letter-spacing:.06em;color:var(--purple);font-weight:700;margin:0}
h1{font-family:var(--font-hand);font-weight:700;font-size:clamp(30px,5vw,40px);line-height:1.25;margin:0;text-wrap:balance}
p{margin:0;color:var(--ink-soft)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-hand);font-weight:700;font-size:19px;color:#fff;background:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:7px 20px;text-decoration:none;transition:transform .2s}
.btn.line{background:#fff;color:var(--ink)}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.mail{font-size:16px}
.mail a{color:var(--ink)}
.box>*{opacity:0;transform:translateY(16px);animation:up .7s cubic-bezier(.2,.8,.3,1) forwards}
.box>.who{animation-delay:.12s}.box>.txt{animation-delay:.22s}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.box>*{animation:none;opacity:1;transform:none}}
@media (max-width:620px){.box{grid-template-columns:1fr;text-align:center}.btns{justify-content:center}.who img{height:min(230px,34svh)}.bub{left:30%}}
</style>
</head>
